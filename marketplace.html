<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Marketplace Zona Pixel: tecnología, audífonos, cargadores, smartphones y más. Envíos rápidos y sin pagos por adelantado.">
    <meta property="og:title" content="Marketplace Zona Pixel - Tecnología">
    <meta property="og:description" content="Compra productos tecnológicos de calidad con entrega rápida y 0 pagos adelantados.">
    <meta property="og:image" content="https://tusitio.com/img/logopequeño.png">
    <meta property="og:url" content="https://tusitio.com/marketplace.html">
    <meta property="og:type" content="website">
    <title>Marketplace Zona Pixel - Tecnología</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="marketplace.css">
</head>
<body>
<div class="marketplace-container">
    <div class="market-header">
        <h1><i class="fas fa-store"></i> Marketplace Zona Pixel</h1>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver al sitio</a>
    </div>
    <div class="market-grid">
        <!-- Catálogo de productos -->
        <div class="products-section">
            <h2><i class="fas fa-microchip"></i> Productos disponibles</h2>
            <div class="products-grid" id="productsGrid"></div>
        </div>
        <!-- Carrito y formulario -->
        <div class="cart-section">
            <h2><i class="fas fa-shopping-cart"></i> Tu pedido</h2>
            <div id="cartContainer"></div>
            <div id="cartTotal" class="cart-total"></div>
            <div class="form-section">
                <h3><i class="fas fa-truck"></i> Datos de envío</h3>
                <form id="orderForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono / WhatsApp *</label>
                        <input type="tel" id="telefono" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección de entrega *</label>
                        <input type="text" id="direccion" required>
                    </div>
                    <button type="submit" class="send-btn" id="submitBtn"><i class="fas fa-envelope"></i> Confirmar pedido</button>
                </form>
                <p class="form-note">* El pedido se envía directamente a Zona Pixel sin que puedas modificar los datos.</p>
            </div>
        </div>
    </div>
    <div class="footer-market">
        <p><i class="fas fa-copyright"></i> Zona Pixel - Calidad y confianza en tecnología</p>
    </div>
</div>

<!-- Modal para detalle del producto -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <div class="modal-body">
            <div class="modal-img" id="modalImgContainer">
                <!-- Aquí se inyectará la imagen o ícono -->
            </div>
            <div class="modal-info">
                <h3 id="modalName"></h3>
                <p class="modal-price" id="modalPrice"></p>
                <p class="modal-description" id="modalDesc"></p>
                <button id="modalAddToCart" class="add-btn-modal">Agregar al carrito</button>
            </div>
        </div>
    </div>
</div>

<script src="marketplace.js" defer></script>
</body>
</html>
